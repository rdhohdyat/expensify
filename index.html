<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expensify Fixed — Indigo Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #03040b; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        [x-cloak] { display: none !important; }
        .glass { background: rgba(30, 30, 46, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(99, 102, 241, 0.1); }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body class="text-zinc-200" x-data="expenseApp()">

    <header class="p-6 pb-2 sticky top-0 bg-[#03040b]/95 backdrop-blur-md z-40">
        <div class="flex justify-between items-start mb-6">
            <div>
                <p class="text-[10px] font-black text-indigo-500 uppercase tracking-[0.2em] mb-1 text-left">Total Pengeluaran</p>
                <h1 class="text-3xl font-bold text-white tracking-tighter" x-text="formatIDR(todayTotal)"></h1>
            </div>
            <button @click="showSettings = true" class="w-10 h-10 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400">
                <i data-lucide="settings-2" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="glass rounded-2xl p-4 mb-4" @click="showSettings = true">
            <div class="flex justify-between text-[10px] font-bold mb-2">
                <span class="text-zinc-500 uppercase text-left">Limit: <span class="text-zinc-300" x-text="formatIDR(dailyLimit)"></span></span>
                <span :class="progress >= 100 ? 'text-red-400' : 'text-indigo-400'" x-text="progress + '%'"></span>
            </div>
            <div class="w-full h-2 bg-zinc-800 rounded-full overflow-hidden">
                <div class="h-full transition-all duration-1000 ease-out" 
                     :class="progress >= 100 ? 'bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.5)]' : 'bg-indigo-500'" 
                     :style="`width: ${progress}%` "></div>
            </div>
        </div>
    </header>

    <main class="px-6 pb-32">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-[10px] font-bold text-zinc-600 uppercase tracking-widest">Riwayat Hari Ini</h2>
            <button @click="confirmReset()" class="text-[10px] text-zinc-700 font-bold hover:text-red-500">RESET</button>
        </div>

        <div class="space-y-3">
            <template x-for="item in transactions" :key="item.id">
                <div class="p-4 glass rounded-2xl flex items-center justify-between group">
                    <div class="flex items-center gap-4 text-left">
                        <div class="w-10 h-10 rounded-xl bg-indigo-500/10 flex items-center justify-center text-indigo-400">
                            <i :data-lucide="getIcon(item.category)" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <p class="text-xs font-bold text-zinc-100" x-text="item.note"></p>
                            <p class="text-[9px] text-zinc-500 font-medium uppercase" x-text="item.category + ' • ' + item.time"></p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-bold text-white" x-text="'- ' + formatIDR(item.amount)"></p>
                        <button @click="deleteItem(item.id)" class="text-[10px] text-red-500/50 hover:text-red-500 font-bold">Hapus</button>
                    </div>
                </div>
            </template>

            <template x-if="transactions.length === 0">
                <div class="py-20 text-center opacity-20">
                    <i data-lucide="ghost" class="w-12 h-12 mx-auto mb-4"></i>
                    <p class="text-xs italic">Belum ada pengeluaran.</p>
                </div>
            </template>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#03040b] via-[#03040b] to-transparent z-50">
        <button @click="showAddModal = true" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-xs shadow-2xl shadow-indigo-600/40 active:scale-95 transition flex items-center justify-center gap-3">
            <i data-lucide="plus-circle" class="w-5 h-5"></i> CATAT TRANSAKSI
        </button>
    </nav>

    <div x-show="showAddModal" x-cloak class="fixed inset-0 z-[60] flex items-end">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" @click="showAddModal = false"></div>
        <div class="relative bg-zinc-900 w-full rounded-t-[2.5rem] p-8 animate-slide-up border-t border-indigo-500/20 shadow-2xl">
            <div class="w-12 h-1.5 bg-zinc-800 rounded-full mx-auto mb-8"></div>
            
            <div class="mb-8 text-center">
                <p class="text-[10px] font-bold text-zinc-500 uppercase mb-2">Jumlah Nominal</p>
                <input type="number" x-model.number="newItem.amount" 
                       class="w-full bg-transparent text-center text-4xl font-bold text-white outline-none" placeholder="0">
            </div>

            <div class="space-y-4 text-left">
                <div>
                    <label class="text-[10px] font-bold text-zinc-500 uppercase ml-1">Nama Barang</label>
                    <input type="text" x-model="newItem.note" placeholder="Beli apa?" 
                           class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl p-4 text-xs mt-2 outline-none focus:border-indigo-500 text-white">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-zinc-500 uppercase ml-1 text-left">Kategori</label>
                    <select x-model="newItem.category" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl p-4 text-xs mt-2 outline-none text-white appearance-none">
                        <option>Makan & Minum</option>
                        <option>Transportasi</option>
                        <option>Hiburan</option>
                        <option>Lain-lain</option>
                    </select>
                </div>
                <button @click="addItem()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-xs mt-4 active:scale-95 transition">SIMPAN TRANSAKSI</button>
            </div>
        </div>
    </div>

    <div x-show="showSettings" x-cloak class="fixed inset-0 z-[70] flex items-end">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" @click="showSettings = false"></div>
        <div class="relative bg-zinc-900 w-full rounded-t-[2.5rem] p-8 animate-slide-up">
            <div class="w-12 h-1.5 bg-zinc-800 rounded-full mx-auto mb-8"></div>
            <h3 class="text-lg font-bold text-white mb-8 text-center">Atur Limit Harian</h3>
            <input type="number" x-model.number="dailyLimit" class="w-full bg-transparent text-center text-5xl font-bold text-indigo-400 outline-none mb-10">
            <button @click="showSettings = false" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-sm">Update Limit</button>
        </div>
    </div>

    <script>
        function expenseApp() {
            return {
                showAddModal: false,
                showSettings: false,
                dailyLimit: 200000,
                transactions: [],
                newItem: { amount: null, category: 'Makan & Minum', note: '' },

                init() {
                    const savedTrx = localStorage.getItem('exp_data_indigo');
                    const savedLim = localStorage.getItem('exp_limit_indigo');
                    if (savedTrx) this.transactions = JSON.parse(savedTrx);
                    if (savedLim) this.dailyLimit = Number(savedLim);
                    
                    this.$nextTick(() => lucide.createIcons());
                    
                    this.$watch('transactions', v => {
                        localStorage.setItem('exp_data_indigo', JSON.stringify(v));
                        this.$nextTick(() => lucide.createIcons());
                    });
                    this.$watch('dailyLimit', v => localStorage.setItem('exp_limit_indigo', v));
                },

                get todayTotal() {
                    return this.transactions.reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
                },

                get progress() {
                    if (!this.dailyLimit) return 0;
                    return Math.min(Math.round((this.todayTotal / this.dailyLimit) * 100), 100);
                },

                addItem() {
                    if (!this.newItem.amount || !this.newItem.note) {
                        alert("Harap isi nominal dan catatan!");
                        return;
                    }

                    const record = {
                        id: Date.now(),
                        amount: this.newItem.amount,
                        category: this.newItem.category,
                        note: this.newItem.note,
                        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
                    };

                    this.transactions = [record, ...this.transactions];
                    this.showAddModal = false;
                    this.newItem = { amount: null, category: 'Makan & Minum', note: '' };
                },

                deleteItem(id) {
                    this.transactions = this.transactions.filter(t => t.id !== id);
                },

                confirmReset() {
                    if (confirm('Hapus semua data?')) this.transactions = [];
                },

                getIcon(cat) {
                    const map = { 'Makan & Minum': 'coffee', 'Transportasi': 'bus', 'Hiburan': 'gamepad-2' };
                    return map[cat] || 'box';
                },

                formatIDR(num) {
                    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);
                }
            }
        }
    </script>
</body>
</html>
