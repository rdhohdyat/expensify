<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duo Hub: Finance + Productivity</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5968/5968746.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #FFFFFF; color: #4B4B4B; }
        [x-cloak] { display: none !important; }
        
        .duo-card { background: #FFFFFF; border: 2px solid #E5E5E5; border-bottom: 5px solid #E5E5E5; border-radius: 1.25rem; }
        
        /* Buttons */
        .duo-btn-green { background: #58CC02; border-bottom: 5px solid #46A302; color: white; transition: all 0.1s; }
        .duo-btn-green:active { border-bottom-width: 0; transform: translateY(5px); }
        
        .duo-btn-blue { background: #1CB0F6; border-bottom: 5px solid #1899D6; color: white; transition: all 0.1s; }
        .duo-btn-blue:active { border-bottom-width: 0; transform: translateY(5px); }
        
        .duo-btn-orange { background: #FF9600; border-bottom: 5px solid #E68700; color: white; transition: all 0.1s; }
        .duo-btn-orange:active { border-bottom-width: 0; transform: translateY(5px); }

        .duo-btn-purple { background: #CE82FF; border-bottom: 5px solid #A568CC; color: white; transition: all 0.1s; }
        .duo-btn-purple:active { border-bottom-width: 0; transform: translateY(5px); }
        
        .duo-btn-gray { background: #FFFFFF; border: 2px solid #E5E5E5; border-bottom: 4px solid #E5E5E5; color: #AFAFAF; }
        
        .duo-input { border: 2px solid #E5E5E5; border-bottom: 4px solid #E5E5E5; border-radius: 1rem; padding: 1rem; width: 100%; font-weight: 800; outline: none; transition: border-color 0.2s; }
        .duo-input:focus { border-color: #1CB0F6; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes pop { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .fade-in { animation: pop 0.2s ease-out forwards; }
        
        /* Shake animation for alarm */
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
        .shake-active { animation: shake 0.5s; animation-iteration-count: infinite; }
    </style>
</head>
<body x-data="superApp()" class="no-scrollbar">

    <div class="max-w-[430px] mx-auto min-h-screen relative bg-white md:border-x-2 md:border-gray-100 overflow-hidden">
        
        <header class="px-6 pt-6 pb-4 flex justify-between items-center border-b-2 border-gray-100 sticky top-0 bg-white z-40">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-orange-400 rounded-xl flex items-center justify-center border-b-4 border-orange-600">
                    <i data-lucide="flame" class="text-white w-6 h-6 fill-current"></i>
                </div>
                <div>
                    <h2 class="text-[10px] font-black text-gray-400 uppercase tracking-widest leading-none">Status</h2>
                    <p class="text-lg font-black text-gray-700" x-text="getGreeting()"></p>
                </div>
            </div>
            <button @click="showLimitModal = true" class="w-10 h-10 rounded-xl flex items-center justify-center border-2 border-gray-100 hover:bg-gray-50">
                <i data-lucide="settings" class="w-5 h-5 text-gray-400"></i>
            </button>
        </header>

        <main class="px-6 pb-36 pt-6">
            
            <div x-show="activeTab === 'finance'" x-cloak class="fade-in">
                <div @click="showLimitModal = true" class="duo-card p-6 mb-8 border-blue-200 bg-blue-50/30 cursor-pointer">
                    <div class="flex justify-between items-start mb-1">
                        <p class="text-[11px] font-black text-blue-400 uppercase tracking-widest">Saldo Tersedia</p>
                        <i data-lucide="pencil" class="w-3 h-3 text-blue-300"></i>
                    </div>
                    <h3 class="text-3xl font-black text-gray-800 mb-6" x-text="formatIDR(wallet.balance)"></h3>
                    
                    <div class="space-y-3">
                        <div class="flex justify-between items-end">
                            <span class="text-xs font-black text-gray-400 uppercase">Limit Harian</span>
                            <span class="text-xs font-black text-gray-600" x-text="financeProgress + '%'"></span>
                        </div>
                        <div class="w-full h-4 bg-gray-200 rounded-full overflow-hidden">
                            <div class="h-full bg-green-500 rounded-full transition-all duration-500 border-b-4 border-green-600" :style="`width: ${financeProgress}%`"></div>
                        </div>
                        <p class="text-[10px] text-center font-black text-gray-400 uppercase" x-text="'Sisa Limit: ' + formatIDR(wallet.dailyLimit - wallet.totalExpense)"></p>
                    </div>
                </div>

                <div class="flex justify-between items-center mb-5">
                    <h4 class="font-black text-xl text-gray-700">Riwayat</h4>
                    <button @click="showFinanceModal = true" class="duo-btn-blue w-10 h-10 rounded-xl flex items-center justify-center">
                        <i data-lucide="plus" class="w-6 h-6 stroke-[3]"></i>
                    </button>
                </div>

                <div class="space-y-4">
                    <template x-for="trx in wallet.transactions" :key="trx.id">
                        <div class="duo-card p-4 flex items-center justify-between group">
                            <div class="flex items-center gap-4">
                                <div :class="trx.type === 'income' ? 'bg-yellow-400 border-yellow-600' : 'bg-blue-400 border-blue-600'" 
                                     class="w-11 h-11 rounded-xl border-b-4 flex items-center justify-center text-white">
                                    <i :data-lucide="trx.type === 'income' ? 'arrow-down-left' : 'arrow-up-right'" class="w-5 h-5"></i>
                                </div>
                                <div>
                                    <p class="text-sm font-black text-gray-700" x-text="trx.note"></p>
                                    <p class="text-[10px] text-gray-400 font-bold uppercase" x-text="trx.time"></p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <p class="font-black text-right" :class="trx.type === 'income' ? 'text-green-500' : 'text-gray-700'" 
                                   x-text="(trx.type === 'income' ? '+' : '-') + formatIDR(trx.amount).replace('Rp', '')"></p>
                                <button @click="deleteTransaction(trx.id)" class="text-gray-300 hover:text-red-500 transition-colors">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div x-show="activeTab === 'savings'" x-cloak class="fade-in">
                <div class="flex justify-between items-center mb-6">
                    <h4 class="font-black text-gray-700 text-2xl">Tabungan</h4>
                    <button @click="showSavingModal = true" class="duo-btn-orange p-3 rounded-xl">
                        <i data-lucide="piggy-bank" class="w-5 h-5 stroke-[3]"></i>
                    </button>
                </div>

                <div class="space-y-6">
                    <template x-for="item in savings" :key="item.id">
                        <div class="duo-card p-5">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h5 class="text-lg font-black text-gray-700" x-text="item.title"></h5>
                                    <p class="text-xs font-bold text-gray-400 uppercase" x-text="'Target: ' + formatIDR(item.target)"></p>
                                </div>
                                <button @click="deleteSaving(item.id)" class="text-gray-300 hover:text-red-500">
                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                </button>
                            </div>
                            
                            <div class="space-y-2 mb-4">
                                <div class="flex justify-between text-[10px] font-black uppercase">
                                    <span class="text-orange-500" x-text="formatIDR(item.current)"></span>
                                    <span class="text-gray-400" x-text="Math.round((item.current/item.target)*100) + '%'"></span>
                                </div>
                                <div class="w-full h-3 bg-gray-100 rounded-full overflow-hidden">
                                    <div class="h-full bg-orange-400 rounded-full transition-all duration-500 border-b-2 border-orange-600" 
                                         :style="`width: ${Math.min((item.current/item.target)*100, 100)}%`"></div>
                                </div>
                            </div>

                            <div class="flex gap-2">
                                <button @click="topUpSaving(item)" class="flex-1 py-2 duo-btn-green rounded-xl text-xs font-black">TAMBAH</button>
                            </div>
                        </div>
                    </template>
                </div>
                
                <div x-show="savings.length === 0" class="text-center py-20">
                    <i data-lucide="box" class="w-12 h-12 text-gray-200 mx-auto mb-4"></i>
                    <p class="text-gray-400 font-bold">Belum ada rencana tabungan</p>
                </div>
            </div>

            <div x-show="activeTab === 'pomo'" x-cloak class="fade-in text-center">
                <div class="mb-4 flex flex-col items-center gap-2">
                    <span class="px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-widest border-2" 
                          :class="pomo.mode === 'focus' ? 'bg-green-50 border-green-200 text-green-500' : 'bg-blue-50 border-blue-200 text-blue-500'"
                          x-text="pomo.mode === 'focus' ? 'Sesi Fokus' : 'Sesi Istirahat'"></span>
                    <button @click="switchMode()" class="text-[10px] font-black text-blue-400 uppercase tracking-tighter flex items-center gap-1">
                        <i data-lucide="refresh-cw" class="w-3 h-3"></i> Ganti Sesi
                    </button>
                </div>

                <div class="mt-4 mb-10 flex flex-col items-center">
                    <div class="relative flex items-center justify-center">
                        <svg class="w-64 h-64 transform -rotate-90">
                            <circle cx="128" cy="128" r="110" stroke="#E5E5E5" stroke-width="12" fill="transparent" />
                            <circle cx="128" cy="128" r="110" :stroke="pomo.mode === 'focus' ? '#58CC02' : '#1CB0F6'" stroke-width="12" fill="transparent" 
                                    stroke-dasharray="691" :stroke-dashoffset="getCircleOffset()"
                                    stroke-linecap="round" class="transition-all duration-1000 ease-linear" />
                        </svg>
                        <div class="absolute">
                            <span class="text-6xl font-black text-gray-700 tracking-tighter tabular-nums" x-text="formatTime()"></span>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-3">
                    <button @click="toggleTimer()" :class="pomo.mode === 'focus' ? 'duo-btn-green' : 'duo-btn-blue'" class="w-full py-4 rounded-2xl font-black text-lg" x-text="pomo.isRunning ? 'PAUSE' : 'MULAI'"></button>
                    <button @click="resetTimer()" class="text-gray-400 font-black text-[10px] uppercase tracking-widest">Reset Waktu</button>
                </div>

                <div class="mt-10 text-left">
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="font-black text-gray-700 text-xl">Target</h4>
                        <button @click="showTaskModal = true" class="text-blue-500 font-black text-xs uppercase">Tambah</button>
                    </div>
                    <div class="space-y-3">
                        <template x-for="task in pomo.tasks" :key="task.id">
                            <div class="duo-card p-4 flex items-center justify-between" :class="task.done ? 'bg-gray-50 opacity-60' : ''">
                                <div @click="task.done = !task.done" class="flex items-center gap-4 cursor-pointer flex-1">
                                    <div class="w-6 h-6 rounded border-2 flex items-center justify-center shrink-0" :class="task.done ? 'bg-green-500 border-green-500' : 'border-gray-200'">
                                        <i data-lucide="check" class="w-4 h-4 text-white stroke-[4]" x-show="task.done"></i>
                                    </div>
                                    <span class="font-bold text-gray-700" :class="task.done ? 'line-through' : ''" x-text="task.title"></span>
                                </div>
                                <button @click="deleteTask(task.id)" class="ml-2 text-gray-300 hover:text-red-500 transition-colors">
                                    <i data-lucide="x" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <div x-show="activeTab === 'reminders'" x-cloak class="fade-in">
                <div class="flex justify-between items-center mb-6">
                    <h4 class="font-black text-gray-700 text-2xl">Jadwal</h4>
                    <button @click="showReminderModal = true" class="duo-btn-purple p-3 rounded-xl">
                        <i data-lucide="bell-plus" class="w-5 h-5 stroke-[3]"></i>
                    </button>
                </div>
                
                <div class="space-y-4">
                    <template x-for="rem in reminders" :key="rem.id">
                        <div class="duo-card p-5 border-purple-200 bg-purple-50/20">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h5 class="text-lg font-black text-gray-700" x-text="rem.title"></h5>
                                    <div class="flex items-center gap-2 mt-1">
                                        <i data-lucide="clock" class="w-3 h-3 text-purple-400"></i>
                                        <p class="text-sm font-bold text-gray-500" x-text="formatDate(rem.time)"></p>
                                    </div>
                                </div>
                                <button @click="deleteReminder(rem.id)" class="text-gray-300 hover:text-red-500">
                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                </button>
                            </div>
                            <div class="mt-3 text-[10px] font-black uppercase tracking-widest text-purple-400" x-text="getTimeRemaining(rem.time)"></div>
                        </div>
                    </template>
                </div>
                
                <div x-show="reminders.length === 0" class="text-center py-20">
                    <i data-lucide="bell-off" class="w-12 h-12 text-gray-200 mx-auto mb-4"></i>
                    <p class="text-gray-400 font-bold">Tidak ada pengingat aktif</p>
                </div>
            </div>

            <div x-show="activeTab === 'notes'" x-cloak class="fade-in">
                <div class="flex justify-between items-center mb-6">
                    <h4 class="font-black text-gray-700 text-2xl">Catatan</h4>
                    <button @click="showNoteModal = true" class="duo-btn-blue p-3 rounded-xl"><i data-lucide="edit-3" class="w-5 h-5 stroke-[3]"></i></button>
                </div>
                <div class="grid grid-cols-1 gap-4">
                    <template x-for="note in notes" :key="note.id">
                        <div class="duo-card p-5 bg-white relative">
                            <h5 class="text-lg font-black text-gray-700 mb-1" x-text="note.title"></h5>
                            <p class="text-sm font-bold text-gray-500" x-text="note.content"></p>
                            <button @click="deleteNote(note.id)" class="mt-4 text-red-400 font-black text-[10px] uppercase">Hapus</button>
                        </div>
                    </template>
                </div>
            </div>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-gray-100 p-2 z-50 md:absolute">
            <div class="max-w-[400px] mx-auto flex justify-between items-center px-2">
                <button @click="activeTab = 'finance'" class="flex flex-col items-center gap-1 p-2 rounded-xl" :class="activeTab === 'finance' ? 'bg-blue-50 text-blue-500' : 'text-gray-300'">
                    <i data-lucide="wallet" class="w-5 h-5 stroke-[2.5]"></i>
                    <span class="text-[9px] font-black uppercase" x-show="activeTab === 'finance'">Dompet</span>
                </button>
                <button @click="activeTab = 'savings'" class="flex flex-col items-center gap-1 p-2 rounded-xl" :class="activeTab === 'savings' ? 'bg-orange-50 text-orange-500' : 'text-gray-300'">
                    <i data-lucide="piggy-bank" class="w-5 h-5 stroke-[2.5]"></i>
                    <span class="text-[9px] font-black uppercase" x-show="activeTab === 'savings'">Tabungan</span>
                </button>
                <button @click="activeTab = 'pomo'" class="flex flex-col items-center gap-1 p-2 rounded-xl" :class="activeTab === 'pomo' ? 'bg-green-50 text-green-500' : 'text-gray-300'">
                    <i data-lucide="target" class="w-5 h-5 stroke-[2.5]"></i>
                    <span class="text-[9px] font-black uppercase" x-show="activeTab === 'pomo'">Fokus</span>
                </button>
                <button @click="activeTab = 'reminders'" class="flex flex-col items-center gap-1 p-2 rounded-xl" :class="activeTab === 'reminders' ? 'bg-purple-50 text-purple-500' : 'text-gray-300'">
                    <i data-lucide="bell" class="w-5 h-5 stroke-[2.5]"></i>
                    <span class="text-[9px] font-black uppercase" x-show="activeTab === 'reminders'">Jadwal</span>
                </button>
                <button @click="activeTab = 'notes'" class="flex flex-col items-center gap-1 p-2 rounded-xl" :class="activeTab === 'notes' ? 'bg-blue-50 text-blue-400' : 'text-gray-300'">
                    <i data-lucide="book-open" class="w-5 h-5 stroke-[2.5]"></i>
                    <span class="text-[9px] font-black uppercase" x-show="activeTab === 'notes'">Catatan</span>
                </button>
            </div>
        </nav>

        <div x-show="showLimitModal" x-cloak class="fixed inset-0 z-[60] flex items-end">
            <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm" @click="showLimitModal = false"></div>
            <div class="relative bg-white w-full rounded-t-[2.5rem] p-8 border-t-4 border-gray-200 overflow-y-auto max-h-[90vh] fade-in">
                <div class="w-12 h-1.5 bg-gray-200 mx-auto mb-8 rounded-full"></div>
                <h3 class="font-black text-gray-400 uppercase text-[10px] tracking-widest mb-4">Pengaturan Keuangan</h3>
                <div class="space-y-4 mb-8">
                    <div>
                        <label class="text-[10px] font-black text-gray-400 ml-1">Saldo Total</label>
                        <input type="number" x-model.number="wallet.balance" class="duo-input">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-gray-400 ml-1">Limit Pengeluaran Harian</label>
                        <input type="number" x-model.number="wallet.dailyLimit" class="duo-input">
                    </div>

                    <button @click="if(confirm('Reset pengeluaran hari ini?')){ resetDailyLimit(); showLimitModal = false; }" 
                            class="w-full py-3 border-2 border-red-200 text-red-500 rounded-xl font-black text-[10px] uppercase hover:bg-red-50 transition-colors">
                        Reset Pengeluaran Hari Ini
                    </button>
                </div>
                <h3 class="font-black text-gray-400 uppercase text-[10px] tracking-widest mb-4">Durasi Pomodoro (Menit)</h3>
                <div class="grid grid-cols-2 gap-4 mb-10">
                    <div>
                        <label class="text-[10px] font-black text-gray-400 ml-1">Fokus</label>
                        <input type="number" x-model.number="pomo.customFocus" @change="updatePomoTimes()" class="duo-input">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-gray-400 ml-1">Istirahat</label>
                        <input type="number" x-model.number="pomo.customBreak" @change="updatePomoTimes()" class="duo-input">
                    </div>
                </div>
                <button @click="showLimitModal = false" class="w-full duo-btn-green py-5 rounded-2xl font-black text-lg">SIMPAN</button>
            </div>
        </div>

        <div x-show="showFinanceModal" x-cloak class="fixed inset-0 z-[60] flex items-end">
            <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm" @click="showFinanceModal = false"></div>
            <div class="relative bg-white w-full rounded-t-[2.5rem] p-8 border-t-4 border-gray-200 fade-in">
                <div class="w-12 h-1.5 bg-gray-200 mx-auto mb-8 rounded-full"></div>
                <div class="flex gap-4 mb-8">
                    <button @click="tempTrx.type = 'expense'" :class="tempTrx.type === 'expense' ? 'duo-btn-blue' : 'duo-btn-gray'" class="flex-1 py-3 rounded-2xl font-black text-[10px] uppercase">Pengeluaran</button>
                    <button @click="tempTrx.type = 'income'" :class="tempTrx.type === 'income' ? 'duo-btn-green' : 'duo-btn-gray'" class="flex-1 py-3 rounded-2xl font-black text-[10px] uppercase">Pemasukan</button>
                </div>
                <input type="number" x-model="tempTrx.amount" placeholder="0" class="w-full bg-transparent text-center text-5xl font-black text-gray-700 outline-none mb-8">
                <input type="text" x-model="tempTrx.note" placeholder="Untuk apa?" class="duo-input text-center mb-8">
                <button @click="addTransaction()" class="w-full duo-btn-green py-5 rounded-2xl font-black text-lg">SIMPAN</button>
            </div>
        </div>

        <div x-show="showSavingModal" x-cloak class="fixed inset-0 z-[60] flex items-end">
            <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm" @click="showSavingModal = false"></div>
            <div class="relative bg-white w-full rounded-t-[2.5rem] p-8 border-t-4 border-gray-200 fade-in">
                <div class="w-12 h-1.5 bg-gray-200 mx-auto mb-8 rounded-full"></div>
                <h3 class="font-black text-center text-gray-700 text-xl mb-6">Rencana Tabungan Baru</h3>
                <input type="text" x-model="tempSaving.title" placeholder="Nama Goal (Contoh: iPhone)" class="duo-input mb-4">
                <input type="number" x-model.number="tempSaving.target" placeholder="Target Nominal (Contoh: 5000000)" class="duo-input mb-8">
                <button @click="addSaving()" class="w-full duo-btn-orange py-5 rounded-2xl font-black text-lg">MULAI MENABUNG</button>
            </div>
        </div>

        <div x-show="showTopUpModal" x-cloak class="fixed inset-0 z-[70] flex items-end">
            <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm" @click="showTopUpModal = false"></div>
            <div class="relative bg-white w-full rounded-t-[2.5rem] p-8 border-t-4 border-gray-200 fade-in">
                <h3 class="font-black text-center text-gray-700 text-xl mb-2" x-text="'Tabungan ' + (selectedSaving?.title || '')"></h3>
                <p class="text-center text-gray-400 text-sm font-bold mb-6">Pindahkan dari saldo utama</p>
                <input type="number" x-model.number="topUpAmount" placeholder="Nominal" class="w-full bg-transparent text-center text-4xl font-black text-gray-700 outline-none mb-8">
                <button @click="confirmTopUp()" class="w-full duo-btn-green py-5 rounded-2xl font-black text-lg">KONFIRMASI</button>
            </div>
        </div>

        <div x-show="showTaskModal" x-cloak class="fixed inset-0 z-[60] flex items-end">
            <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm" @click="showTaskModal = false"></div>
            <div class="relative bg-white w-full rounded-t-[2.5rem] p-8 border-t-4 border-gray-200">
                <input type="text" x-model="tempTask" placeholder="Target baru..." class="duo-input text-center mb-6">
                <button @click="addTask()" class="w-full duo-btn-green py-5 rounded-2xl font-black text-lg">TAMBAH</button>
            </div>
        </div>

        <div x-show="showReminderModal" x-cloak class="fixed inset-0 z-[60] flex items-end">
            <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm" @click="showReminderModal = false"></div>
            <div class="relative bg-white w-full rounded-t-[2.5rem] p-8 border-t-4 border-gray-200 fade-in">
                <div class="w-12 h-1.5 bg-gray-200 mx-auto mb-8 rounded-full"></div>
                <h3 class="font-black text-center text-gray-700 text-xl mb-6">Jadwal Pengingat</h3>
                <input type="text" x-model="tempReminder.title" placeholder="Ingatkan tentang..." class="duo-input mb-4">
                <label class="text-[10px] font-black text-gray-400 ml-1">Waktu</label>
                <input type="datetime-local" x-model="tempReminder.time" class="duo-input mb-8 text-gray-700">
                <button @click="addReminder()" class="w-full duo-btn-purple py-5 rounded-2xl font-black text-lg">SET PENGINGAT</button>
            </div>
        </div>

        <div x-show="showNoteModal" x-cloak class="fixed inset-0 z-[60] flex items-end">
            <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm" @click="showNoteModal = false"></div>
            <div class="relative bg-white w-full rounded-t-[2.5rem] p-8 border-t-4 border-gray-200">
                <input type="text" x-model="tempNote.title" placeholder="Judul" class="duo-input mb-4">
                <textarea x-model="tempNote.content" rows="4" placeholder="Isi catatan..." class="duo-input mb-6"></textarea>
                <button @click="addNote()" class="w-full duo-btn-blue py-5 rounded-2xl font-black text-lg">SIMPAN</button>
            </div>
        </div>

        <div x-show="activeAlarm" x-cloak class="fixed inset-0 z-[80] flex items-center justify-center p-6">
            <div class="absolute inset-0 bg-purple-900/80 backdrop-blur-md"></div>
            <div class="relative bg-white w-full max-w-sm rounded-[2rem] p-8 text-center shake-active border-b-8 border-gray-200 shadow-2xl">
                <div class="w-20 h-20 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i data-lucide="bell-ring" class="w-10 h-10 text-purple-600"></i>
                </div>
                <h2 class="text-2xl font-black text-gray-800 mb-2">PENGINGAT!</h2>
                <p class="text-lg font-bold text-gray-500 mb-8" x-text="activeAlarm?.title"></p>
                <button @click="dismissAlarm()" class="w-full duo-btn-purple py-4 rounded-2xl font-black text-lg">OKE, MENGERTI</button>
            </div>
        </div>
    </div>

    <script>
        function superApp() {
            return {
                activeTab: 'finance',
                showFinanceModal: false, showLimitModal: false, showTaskModal: false, showNoteModal: false,
                showSavingModal: false, showTopUpModal: false, showReminderModal: false,
                
                wallet: { balance: 2500000, dailyLimit: 200000, transactions: [], totalExpense: 0 },
                savings: [],
                reminders: [],
                tempSaving: { title: '', target: '' },
                tempReminder: { title: '', time: '' },
                activeAlarm: null,
                
                selectedSaving: null,
                topUpAmount: '',
                tempTrx: { type: 'expense', amount: '', note: '' },
                pomo: { 
                    focusTime: 1500, breakTime: 300, timeLeft: 1500, 
                    isRunning: false, timer: null, tasks: [], 
                    mode: 'focus', customFocus: 25, customBreak: 5 
                },
                tempTask: '', notes: [], tempNote: { title: '', content: '' },

                init() {
                    this.requestNotification();
                    const saved = localStorage.getItem('duo_hub_reminders_v3');
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.wallet = data.wallet || this.wallet;
                        this.pomo = {...this.pomo, ...data.pomo};
                        this.notes = data.notes || [];
                        this.savings = data.savings || [];
                        this.reminders = data.reminders || [];
                        this.pomo.isRunning = false;
                        this.pomo.timer = null;
                        this.checkDailyReset();
                    }
                    this.$nextTick(() => lucide.createIcons());
                    
                    // Auto-save watchers
                    this.$watch('wallet', () => this.saveData());
                    this.$watch('savings', () => this.saveData());
                    this.$watch('pomo.tasks', () => this.saveData());
                    this.$watch('notes', () => this.saveData());
                    this.$watch('reminders', () => this.saveData());

                    // Start Reminder Checker Loop
                    setInterval(() => {
                        this.checkReminders();
                    }, 1000);
                },

                checkDailyReset() {
                    const today = new Date().toDateString();
                    const lastReset = localStorage.getItem('last_reset_date');
                    if (lastReset !== today) {
                        this.resetDailyLimit();
                        localStorage.setItem('last_reset_date', today);
                    }
                },

                resetDailyLimit() {
                    this.wallet.totalExpense = 0;
                    this.saveData();
                },

                requestNotification() {
                    if ("Notification" in window) Notification.requestPermission();
                },

                saveData() {
                    const data = { 
                        wallet: this.wallet, 
                        savings: this.savings,
                        reminders: this.reminders,
                        pomo: { 
                            tasks: this.pomo.tasks, 
                            customFocus: this.pomo.customFocus, 
                            customBreak: this.pomo.customBreak,
                            focusTime: this.pomo.focusTime,
                            breakTime: this.pomo.breakTime,
                            timeLeft: this.pomo.timeLeft,
                            mode: this.pomo.mode
                        }, 
                        notes: this.notes 
                    };
                    localStorage.setItem('duo_hub_reminders_v3', JSON.stringify(data));
                    this.$nextTick(() => lucide.createIcons());
                },

                playSound(type) {
                    // SUARA DIHILANGKAN
                },

                getGreeting() {
                    const hrs = new Date().getHours();
                    if (hrs >= 5 && hrs < 11) return "Pagi, Semangat!";
                    if (hrs >= 11 && hrs < 15) return "Siang, Terus Maju!";
                    if (hrs >= 15 && hrs < 18) return "Sore, Jangan Lelah!";
                    return "Malam, Istirahatlah!";
                },

                formatIDR(num) {
                    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);
                },

                get financeProgress() {
                    if (this.wallet.dailyLimit <= 0) return 0;
                    return Math.min(Math.round((this.wallet.totalExpense / this.wallet.dailyLimit) * 100), 100) || 0;
                },

                // Finance Logic
                addTransaction() {
                    if(!this.tempTrx.amount || !this.tempTrx.note) return;
                    const amt = Number(this.tempTrx.amount);
                    if(this.tempTrx.type === 'income') this.wallet.balance += amt;
                    else { this.wallet.balance -= amt; this.wallet.totalExpense += amt; }
                    this.wallet.transactions.unshift({
                        id: Date.now(), ...this.tempTrx, amount: amt,
                        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
                    });
                    this.showFinanceModal = false;
                    this.tempTrx = { type: 'expense', amount: '', note: '' };
                },

                deleteTransaction(id) {
                    const index = this.wallet.transactions.findIndex(t => t.id === id);
                    if (index > -1) {
                        const trx = this.wallet.transactions[index];
                        if(trx.type === 'income') this.wallet.balance -= trx.amount;
                        else { this.wallet.balance += trx.amount; this.wallet.totalExpense -= trx.amount; }
                        this.wallet.transactions.splice(index, 1);
                    }
                },

                // Savings Logic
                addSaving() {
                    if(!this.tempSaving.title || !this.tempSaving.target) return;
                    this.savings.push({
                        id: Date.now(),
                        title: this.tempSaving.title,
                        target: Number(this.tempSaving.target),
                        current: 0
                    });
                    this.tempSaving = { title: '', target: '' };
                    this.showSavingModal = false;
                },

                topUpSaving(item) {
                    this.selectedSaving = item;
                    this.showTopUpModal = true;
                    this.topUpAmount = '';
                },

                confirmTopUp() {
                    const amt = Number(this.topUpAmount);
                    if(amt <= 0 || amt > this.wallet.balance) {
                        alert("Saldo tidak cukup!");
                        return;
                    }
                    this.selectedSaving.current += amt;
                    this.wallet.balance -= amt;
                    this.wallet.transactions.unshift({
                        id: Date.now(), type: 'expense', amount: amt, note: `Nabung: ${this.selectedSaving.title}`,
                        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
                    });
                    this.showTopUpModal = false;
                },

                deleteSaving(id) {
                    if(confirm('Batalkan tabungan ini? Saldo akan kembali ke dompet.')) {
                        const item = this.savings.find(s => s.id === id);
                        this.wallet.balance += item.current;
                        this.savings = this.savings.filter(s => s.id !== id);
                    }
                },

                // Reminder Logic (NEW)
                addReminder() {
                    if(!this.tempReminder.title || !this.tempReminder.time) return;
                    this.reminders.push({
                        id: Date.now(),
                        title: this.tempReminder.title,
                        time: this.tempReminder.time,
                        notified: false
                    });
                    // Sort by time
                    this.reminders.sort((a, b) => new Date(a.time) - new Date(b.time));
                    this.tempReminder = { title: '', time: '' };
                    this.showReminderModal = false;
                },

                deleteReminder(id) {
                    this.reminders = this.reminders.filter(r => r.id !== id);
                },

                checkReminders() {
                    const now = new Date();
                    this.reminders.forEach(rem => {
                        const remTime = new Date(rem.time);
                        if (!rem.notified && now >= remTime) {
                            rem.notified = true;
                            this.triggerAlarm(rem);
                        }
                    });
                },

                triggerAlarm(reminder) {
                    // Browser Notification
                    if ("Notification" in window && Notification.permission === "granted") {
                        new Notification("PENGINGAT!", {
                            body: reminder.title,
                            icon: 'https://cdn-icons-png.flaticon.com/512/5968/5968746.png'
                        });
                    }
                    // In-App Visual Alert
                    this.activeAlarm = reminder;
                },

                dismissAlarm() {
                    if(this.activeAlarm) {
                        this.deleteReminder(this.activeAlarm.id);
                        this.activeAlarm = null;
                    }
                },

                formatDate(dateString) {
                    const options = { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' };
                    return new Date(dateString).toLocaleDateString('id-ID', options);
                },

                getTimeRemaining(targetDate) {
                    const total = Date.parse(targetDate) - Date.parse(new Date());
                    if (total <= 0) return "WAKTU HABIS";
                    const days = Math.floor(total / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((total / (1000 * 60 * 60)) % 24);
                    if (days > 0) return `${days} HARI LAGI`;
                    return `${hours} JAM LAGI`;
                },

                // Pomodoro Logic
                getCircleOffset() {
                    const total = this.pomo.mode === 'focus' ? this.pomo.focusTime : this.pomo.breakTime;
                    return 691 - (691 * this.pomo.timeLeft) / total;
                },

                updatePomoTimes() {
                    this.pomo.focusTime = parseInt(this.pomo.customFocus) * 60;
                    this.pomo.breakTime = parseInt(this.pomo.customBreak) * 60;
                    this.resetTimer();
                },

                formatTime() {
                    const m = Math.floor(this.pomo.timeLeft / 60);
                    const s = this.pomo.timeLeft % 60;
                    return `${m}:${s.toString().padStart(2, '0')}`;
                },

                toggleTimer() {
                    if (this.pomo.isRunning) {
                        clearInterval(this.pomo.timer);
                        this.pomo.isRunning = false;
                    } else {
                        this.pomo.isRunning = true;
                        this.pomo.timer = setInterval(() => {
                            if (this.pomo.timeLeft > 0) {
                                this.pomo.timeLeft--;
                            } else {
                                clearInterval(this.pomo.timer);
                                this.pomo.isRunning = false;
                                this.switchMode();
                            }
                        }, 1000);
                    }
                },

                switchMode() {
                    this.pomo.mode = (this.pomo.mode === 'focus') ? 'break' : 'focus';
                    this.pomo.timeLeft = (this.pomo.mode === 'focus') ? this.pomo.focusTime : this.pomo.breakTime;
                    if (this.pomo.isRunning) {
                        clearInterval(this.pomo.timer);
                        this.pomo.isRunning = false;
                    }
                },

                resetTimer() {
                    clearInterval(this.pomo.timer);
                    this.pomo.isRunning = false;
                    this.pomo.timeLeft = this.pomo.mode === 'focus' ? this.pomo.focusTime : this.pomo.breakTime;
                },

                addTask() {
                    if(!this.tempTask) return;
                    this.pomo.tasks.push({ id: Date.now(), title: this.tempTask, done: false });
                    this.tempTask = ''; this.showTaskModal = false;
                },

                deleteTask(id) {
                    this.pomo.tasks = this.pomo.tasks.filter(t => t.id !== id);
                },

                // Note Logic
                addNote() {
                    if(!this.tempNote.title) return;
                    this.notes.unshift({ id: Date.now(), ...this.tempNote });
                    this.tempNote = { title: '', content: '' };
                    this.showNoteModal = false;
                },

                deleteNote(id) { 
                    this.notes = this.notes.filter(n => n.id !== id); 
                }
            }
        }
    </script>
</body>
</html>
